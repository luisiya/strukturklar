# Content editor at /admin/. Sign in with a GitHub token; every save is a commit to main,
# which the deploy workflow (.github/workflows/deploy.yml) publishes automatically.
backend:
  name: github
  repo: luisiya/strukturklar
  branch: main
locale: de
media_folder: public/images
public_folder: /images
i18n:
  structure: multiple_files
  locales:
    - de
    - en
    - ru
    - uk
  default_locale: de
collections:
